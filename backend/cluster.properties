# AgentGrid-Lite 5-Node Cluster Configuration
# Ports are chosen in 1601-1605 to avoid collisions with standalone demos (1099, 1100-1102, 1201-1203, 1301-1305, 1401-1403).

node.ids=1,2,3,4,5

# Delay (ms) each node adds to every subtask. The real stage work (keyword match, TF-IDF,
# extractive summary) is sub-millisecond; without this delay the thread-pool (Exp 2) and
# load-balancing (Exp 6) effects vanish. Override with -Dagentgrid.simulatedWorkMs=<ms>.
simulatedWorkMs=150

# Node 1 (weak capacity, positive clock drift)
node.1.port=1601
node.1.poolSize=2
node.1.clockDriftMs=3000

# Node 2 (medium capacity, negative clock drift)
node.2.port=1602
node.2.poolSize=4
node.2.clockDriftMs=-2000

# Node 3 (medium capacity, mild positive drift)
node.3.port=1603
node.3.poolSize=4
node.3.clockDriftMs=500

# Node 4 (strong capacity, zero clock drift / reference node)
node.4.port=1604
node.4.poolSize=6
node.4.clockDriftMs=0

# Node 5 (strong capacity, positive clock drift)
node.5.port=1605
node.5.poolSize=6
node.5.clockDriftMs=1500
